[package]
name         = "memory-engine"
version      = "0.18.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/memory-engine"
description  = "Typed database operation engine over memory and signal-memory"
publish      = false

[lib]
name = "memory_engine"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
memory = { git = "https://github.com/LiGoldragon/memory.git", rev = "69d91c486b335575ee5e4b0eb79da27094e700b6" }
signal-memory = { git = "https://github.com/LiGoldragon/signal-memory.git", rev = "7f3251ed9b40345c0cc6f75b607472f78eeadcfc", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = { level = "warn", priority = -1 }
